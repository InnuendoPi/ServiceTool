name: ServiceTool Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the generated packages as a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: servicetool-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build Windows package
        shell: pwsh
        run: .\build_servicetool_windows_release.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Brautomat32ServiceTool-windows
          path: Brautomat32ServiceTool-win.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build ServiceTool for Linux
        shell: bash
        run: |
          rm -rf build dist AppDir artifact
          pyinstaller --noconfirm --clean Brautomat32ServiceTool.spec

      - name: Package Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin artifact/package
          cp dist/Brautomat32ServiceTool AppDir/usr/bin/Brautomat32ServiceTool
          chmod +x AppDir/usr/bin/Brautomat32ServiceTool
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Brautomat32ServiceTool" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/Brautomat32ServiceTool.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Brautomat32 ServiceTool
          Exec=Brautomat32ServiceTool
          Icon=Brautomat32ServiceTool
          Categories=Utility;
          Terminal=true
          EOF
          python - <<'PY'
          import struct
          import zlib

          width = height = 256
          color = bytes((13, 110, 253, 255))
          row = b"\x00" + color * width
          raw = row * height

          def chunk(tag, data):
              return (
                  struct.pack("!I", len(data))
                  + tag
                  + data
                  + struct.pack("!I", zlib.crc32(tag + data) & 0xFFFFFFFF)
              )

          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack("!2I5B", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          with open("AppDir/Brautomat32ServiceTool.png", "wb") as handle:
              handle.write(png)
          PY
          curl --fail --location --output appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool.AppImage AppDir artifact/package/Brautomat32ServiceTool.AppImage
          cp README.md artifact/package/README.md
          cp docker-compose.yml artifact/package/docker-compose.yml
          cp -r docker artifact/package/docker
          cp -r examples artifact/package/examples
          mkdir -p artifact/package/tools
          cp tools/mock_server.py artifact/package/tools/mock_server.py
          cd artifact/package
          zip -r ../../Brautomat32ServiceTool-linux.zip Brautomat32ServiceTool.AppImage README.md docker-compose.yml docker examples tools

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: Brautomat32ServiceTool-linux
          path: Brautomat32ServiceTool-linux.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build ServiceTool app
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name Brautomat32ServiceTool \
            --collect-all zeroconf \
            --collect-all ifaddr \
            --collect-all serial \
            --collect-all certifi \
            --add-data "static:static" \
            app.py

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/package
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Brautomat32ServiceTool.app Brautomat32ServiceTool-macos.zip
          cp docker-compose.yml artifact/package/docker-compose.yml
          cp -r docker artifact/package/docker
          cp -r examples artifact/package/examples
          mkdir -p artifact/package/tools
          cp tools/mock_server.py artifact/package/tools/mock_server.py
          cd artifact/package
          zip -r ../../Brautomat32ServiceTool-macos.zip docker-compose.yml docker examples tools

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: Brautomat32ServiceTool-macos
          path: Brautomat32ServiceTool-macos.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: inputs.publish_release
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify unchanged main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Publishing is only allowed from main."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "main changed after this workflow started. Run the release workflow again for the current main commit."
            exit 1
          fi

      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: Brautomat32ServiceTool-windows
          path: release/windows

      - name: Download Linux package
        uses: actions/download-artifact@v7
        with:
          name: Brautomat32ServiceTool-linux
          path: release/linux

      - name: Download macOS package
        uses: actions/download-artifact@v7
        with:
          name: Brautomat32ServiceTool-macos
          path: release/macos

      - name: Prepare manifest from verified packages
        id: manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          version_path = Path("version.json")
          data = json.loads(version_path.read_text(encoding="utf-8-sig"))
          version = str(data.get("version") or "").strip()
          if not version:
              raise SystemExit("version.json does not contain a version")

          release_tag = f"v{version}"
          packages = {
              "windows": Path("release/windows/Brautomat32ServiceTool-win.zip"),
              "linux": Path("release/linux/Brautomat32ServiceTool-linux.zip"),
              "macos": Path("release/macos/Brautomat32ServiceTool-macos.zip"),
          }
          base_url = f"https://github.com/InnuendoPi/ServiceTool/releases/download/{release_tag}"
          for platform, package_path in packages.items():
              if not package_path.is_file():
                  raise SystemExit(f"Missing release package: {package_path}")
              data[platform] = {
                  "filename": package_path.name,
                  "url": f"{base_url}/{package_path.name}",
                  "sha256": hashlib.sha256(package_path.read_bytes()).hexdigest(),
              }

          data["released_at"] = datetime.now(timezone.utc).date().isoformat()
          version_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          Path("release-tag.txt").write_text(release_tag + "\n", encoding="utf-8")
          PY
          echo "tag=$(cat release-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Create or resume immutable draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.manifest.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            if [ "$is_draft" = "true" ]; then
              if [ "$target" != "${GITHUB_SHA}" ]; then
                echo "Draft release $tag targets $target instead of ${GITHUB_SHA}."
                exit 1
              fi
              gh release upload "$tag" \
                release/windows/Brautomat32ServiceTool-win.zip \
                release/linux/Brautomat32ServiceTool-linux.zip \
                release/macos/Brautomat32ServiceTool-macos.zip \
                --clobber
              echo "Resumed draft release $tag."
            else
              echo "Published release $tag already exists; verify it without replacing assets."
            fi
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "publish=$is_draft" >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" \
              release/windows/Brautomat32ServiceTool-win.zip \
              release/linux/Brautomat32ServiceTool-linux.zip \
              release/macos/Brautomat32ServiceTool-macos.zip \
              --target "${GITHUB_SHA}" \
              --title "Brautomat32 ServiceTool $tag" \
              --generate-notes \
              --draft
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release source and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.manifest.outputs.tag }}"
          target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
          if [ "$target" != "${GITHUB_SHA}" ]; then
            echo "Release $tag targets $target instead of ${GITHUB_SHA}."
            echo "Published versions are immutable; increase the ServiceTool version."
            exit 1
          fi

          gh release view "$tag" --json assets \
            --jq '.assets[] | [.name, .size] | @tsv' > release-assets.tsv
          python - <<'PY'
          from pathlib import Path

          expected_paths = [
              Path("release/windows/Brautomat32ServiceTool-win.zip"),
              Path("release/linux/Brautomat32ServiceTool-linux.zip"),
              Path("release/macos/Brautomat32ServiceTool-macos.zip"),
          ]
          expected = {path.name: path.stat().st_size for path in expected_paths}
          actual = {}
          for line in Path("release-assets.tsv").read_text(encoding="utf-8").splitlines():
              name, size = line.split("\t", 1)
              actual[name] = int(size)
          if actual != expected:
              raise SystemExit(
                  "Release assets differ from this workflow run.\n"
                  f"Expected: {expected}\n"
                  f"Actual:   {actual}\n"
                  "Published versions are immutable; increase the ServiceTool version."
              )
          PY

      - name: Publish verified draft release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${{ steps.manifest.outputs.tag }}" --draft=false --latest

      - name: Verify published release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.manifest.outputs.tag }}"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Release $tag is still a draft."
            exit 1
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git rev-list -n 1 "$tag")" != "${GITHUB_SHA}" ]; then
            echo "Release tag $tag does not point to ${GITHUB_SHA}."
            exit 1
          fi
          mkdir -p release/verified
          gh release download "$tag" \
            --dir release/verified \
            --pattern 'Brautomat32ServiceTool-*.zip'
          python - <<'PY'
          import hashlib
          from pathlib import Path

          source_dirs = {
              "Brautomat32ServiceTool-win.zip": Path("release/windows"),
              "Brautomat32ServiceTool-linux.zip": Path("release/linux"),
              "Brautomat32ServiceTool-macos.zip": Path("release/macos"),
          }

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for filename, source_dir in source_dirs.items():
              source = source_dir / filename
              downloaded = Path("release/verified") / filename
              if not downloaded.is_file():
                  raise SystemExit(f"Verified release asset is missing: {filename}")
              if sha256(source) != sha256(downloaded):
                  raise SystemExit(f"Release asset checksum mismatch: {filename}")
          PY

      - name: Publish release manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "main changed before the manifest could be published."
            echo "The release exists, but no update was announced. Re-run from the current main commit with a new version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish ServiceTool ${{ steps.manifest.outputs.tag }}"
            git push origin HEAD:main
          fi
